[project]
name = "gridpulse"
version = "0.1.0"
description = "Data platform + AI assistant for the Romanian power system (ENTSO-E, Energy-Charts)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "adlfs>=2024.12",
    "anthropic>=1.0",
    "azure-ai-documentintelligence>=1.0",
    "dbt-core>=1.10",
    "dbt-postgres>=1.9",
    "fastembed>=0.6",
    "fsspec>=2025.3",
    "httpx>=0.28",
    "lightgbm>=4.6",
    "numpy>=2.2",
    "openai>=2.0",
    "pandas>=2.2",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pypdf>=5",
    "pyyaml>=6",
    "scipy>=1.15",
    "sqlglot>=27",
    "streamlit>=1.45",
    "tenacity>=9.1",
    "typer>=0.16",
    "tzdata>=2025.2",
]

[project.scripts]
gridpulse = "gridpulse.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "respx>=0.22",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridpulse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a reachable, disposable Postgres (TEST_DATABASE_URL)"]
