name: Deploy

# After CI passes on main: build arm64 images (Oracle A1 is ARM) on GitHub's ARM runner,
# push them to GHCR, then pull and restart the stack on the VM over SSH.
# Off until the repository variable DEPLOY_ENABLED is set to "true" (see de-facut.md).
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        image: [app, airflow]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          platforms: linux/arm64  # add linux/amd64 if the Hetzner fallback (x86) is used
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gridpulse-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/gridpulse-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull and restart on the VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/gridpulse-ro
            git pull --ff-only
            export GRIDPULSE_IMAGE_PREFIX=ghcr.io/${{ github.repository_owner }}/gridpulse
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env pull
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --remove-orphans
            docker image prune -f
            curl -fsS --retry 5 --retry-delay 10 "https://$(grep ^GRIDPULSE_DOMAIN deploy/.env | cut -d= -f2)/healthz"
