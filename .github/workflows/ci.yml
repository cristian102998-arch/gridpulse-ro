name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gridpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      azurite:
        # Azure Blob emulator: the raw zone and backups use abfs:// in production.
        image: mcr.microsoft.com/azure-storage/azurite:3.35.0
        ports: ["10000:10000"]
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gridpulse
      # Azurite's well-known development account (public, documented by Microsoft).
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v
      - name: dbt build on the sample day (2025-10-26, 25 hours)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          uv run python scripts/load_sample.py
          uv run gridpulse db env >> "$GITHUB_ENV"
      - run: uv run dbt build --project-dir dbt --profiles-dir dbt

  dags:
    # Airflow has its own pinned constraints, so it gets a plain venv, not the uv project.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install "apache-airflow==3.3.2" apache-airflow-providers-standard pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt"
      - run: python -m pytest tests/test_dag_integrity.py -v -p no:cacheprovider --rootdir . --noconftest
