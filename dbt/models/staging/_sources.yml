version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: energy_charts_public_power
        description: One row per local day with the Energy-Charts JSON response (CC BY 4.0).
        loaded_at_field: fetched_at
        freshness:
          warn_after: {count: 30, period: hour}
          error_after: {count: 54, period: hour}
      - name: entsoe_documents
        description: ENTSO-E Transparency Platform responses per dataset and local day.
        loaded_at_field: fetched_at
      - name: open_meteo_temperature
        description: Hourly temperature per city from the Open-Meteo Previous Runs API (CC BY 4.0).
        loaded_at_field: fetched_at
      - name: open_meteo_cities
  - name: ml
    schema: ml
    description: Written by `gridpulse forecast backtest|predict` (Python), read here.
    tables:
      - name: load_forecasts
      - name: backtest_predictions
      - name: backtest_metrics
