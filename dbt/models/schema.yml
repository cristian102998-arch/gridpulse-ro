version: 2

seeds:
  - name: dim_source
    description: Energy-Charts series names mapped to our source codes and categories.
    columns:
      - name: energy_charts_name
        data_tests: [unique, not_null]
      - name: source_code
        data_tests: [unique, not_null]
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: [generation, storage, load, derived, trade]

  - name: ro_public_holidays
    description: Romanian public holidays (Codul Muncii art. 139), generated by scripts/make_holidays.py.
    columns:
      - name: holiday_date
        data_tests: [unique, not_null]

models:
  - name: stg_energy_charts__public_power
    description: Energy-Charts public_power unpacked to one row per 15-minute interval and series.
    columns:
      - name: interval_start_utc
        data_tests: [not_null]
      - name: energy_charts_name
        description: If Energy-Charts adds a new series, this test fails until dim_source maps it.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_source')
                field: energy_charts_name

  - name: fct_generation_hourly
    description: Hourly generation (MWh) per source for Romania. Grain = hour_utc x source_code.
    columns:
      - name: hour_utc
        data_tests: [not_null]
      - name: source_code
        data_tests: [not_null]
      - name: n_quarters
        description: Quarter-hours with a value. 4 for a complete hour.

  - name: stg_entsoe__points
    description: ENTSO-E points unpacked to one row per interval and series.
    columns:
      - name: dataset
        data_tests:
          - accepted_values:
              arguments:
                values: [load-actual, load-forecast, generation, price]

  - name: dim_date
    description: Calendar of local days 2023-2030 with holidays and day length.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: day_hours
        data_tests:
          - accepted_values:
              arguments:
                values: [23, 24, 25]
                quote: false

  - name: fct_load_hourly
    description: Hourly load (MWh) from ENTSO-E and Energy-Charts side by side, plus the TSO forecast.
    columns:
      - name: hour_utc
        data_tests: [unique, not_null]
      - name: load_actual_source
        data_tests:
          - accepted_values:
              arguments:
                values: [entsoe, energy_charts]

  - name: fct_price_hourly
    description: Hourly day-ahead price (EUR/MWh), averaged from 15-minute prices.
    columns:
      - name: hour_utc
        data_tests: [unique, not_null]

  - name: mart_daily_kpis
    description: One row per complete local day. Feeds the bulletin and the SQL agent.
    columns:
      - name: local_day
        data_tests: [unique, not_null]
