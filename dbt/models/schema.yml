version: 2

# Descriptions are persisted as Postgres comments (persist_docs) and read by the SQL agent,
# so they state units and grain plainly.

seeds:
  - name: dim_source
    description: Generation sources and other Energy-Charts series. Join on source_code.
    columns:
      - name: energy_charts_name
        data_tests: [unique, not_null]
      - name: source_code
        description: "Key, e.g. nuclear, lignite, hard_coal, gas, hydro_reservoir, hydro_ror, wind, solar, biomass, battery."
        data_tests: [unique, not_null]
      - name: source_label
        description: Human-readable name.
      - name: category
        description: "generation, storage (battery), load, derived or trade."
        data_tests:
          - accepted_values:
              arguments:
                values: [generation, storage, load, derived, trade]
      - name: is_renewable
        description: True for hydro, wind, solar, biomass. Null for non-generation series.

  - name: ro_public_holidays
    description: Romanian public holidays (Codul Muncii art. 139), generated by scripts/make_holidays.py.
    columns:
      - name: holiday_date
        data_tests: [unique, not_null]

models:
  - name: stg_energy_charts__public_power
    description: Energy-Charts public_power unpacked to one row per 15-minute interval and series.
    columns:
      - name: interval_start_utc
        data_tests: [not_null]
      - name: energy_charts_name
        description: If Energy-Charts adds a new series, this test fails until dim_source maps it.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_source')
                field: energy_charts_name

  - name: stg_entsoe__points
    description: ENTSO-E points unpacked to one row per interval and series.
    columns:
      - name: dataset
        data_tests:
          - accepted_values:
              arguments:
                values: [load-actual, load-forecast, generation, price]

  - name: dim_date
    description: One row per local day (Europe/Bucharest), 2023-2030, with Romanian public holidays.
    columns:
      - name: date_day
        description: Local date. Join to local_day in the fact tables.
        data_tests: [unique, not_null]
      - name: iso_day_of_week
        description: 1 = Monday ... 7 = Sunday.
      - name: is_holiday
        description: Romanian public holiday.
      - name: holiday_name
        description: Name of the holiday in Romanian, null on other days.
      - name: is_working_day
        description: Not a weekend and not a public holiday.
      - name: day_hours
        description: Length of the local day in hours, 23 or 25 on clock-change days.
        data_tests:
          - accepted_values:
              arguments:
                values: [23, 24, 25]
                quote: false

  - name: fct_generation_hourly
    description: "Hourly electricity generation in Romania per source. Grain: one row per hour_utc and source_code. Sum generation_mwh for energy."
    columns:
      - name: hour_utc
        description: Start of the hour, UTC.
        data_tests: [not_null]
      - name: hour_local
        description: Start of the hour, local time (Europe/Bucharest), timestamp without time zone.
      - name: local_day
        description: Local date of the hour.
      - name: source_code
        description: Join to dim_source.source_code.
        data_tests: [not_null]
      - name: generation_mwh
        description: Energy produced in the hour, MWh (equal to the average MW in that hour). Battery is net, negative while charging. Null = no data.
      - name: n_quarters
        description: Quarter-hours with a value. 4 for a complete hour.

  - name: fct_load_hourly
    description: "Hourly electricity consumption (load) in Romania. Grain: one row per hour_utc."
    columns:
      - name: hour_utc
        description: Start of the hour, UTC.
        data_tests: [unique, not_null]
      - name: hour_local
        description: Start of the hour, local time.
      - name: local_day
        description: Local date of the hour.
      - name: load_actual_mwh
        description: Consumption in the hour, MWh (= average MW). Use this column for load questions.
      - name: load_actual_source
        description: Where load_actual_mwh came from, entsoe or energy_charts.
        data_tests:
          - accepted_values:
              arguments:
                values: [entsoe, energy_charts]
      - name: load_forecast_tso_mwh
        description: Transelectrica's day-ahead forecast for the hour, MWh. Null until the ENTSO-E feed is connected.

  - name: fct_price_hourly
    description: "Day-ahead electricity price for Romania. Grain: one row per hour_utc. Empty until the ENTSO-E feed is connected."
    columns:
      - name: hour_utc
        data_tests: [unique, not_null]
      - name: price_eur_mwh
        description: Hourly price, EUR/MWh, the average of the four 15-minute prices.

  - name: fct_weather_hourly
    description: "Population-weighted national temperature (8 largest cities). Grain: one row per hour_utc."
    columns:
      - name: hour_utc
        data_tests: [unique, not_null]
      - name: temp_actual_c
        description: Temperature, degrees Celsius (model analysis).
      - name: temp_forecast_c
        description: Temperature as forecast 48 hours ahead, degrees Celsius.
      - name: temp_forecast_source
        data_tests:
          - accepted_values:
              arguments:
                values: [forecast_48h, forecast_24h, analysis]

  - name: fct_load_forecast_baseline
    description: "Every load forecast next to actual load. Grain: one row per hour_utc."
    columns:
      - name: load_actual_mwh
        description: Actual consumption, MWh.
      - name: forecast_naive_168h_mwh
        description: Seasonal naive forecast = load at the same hour one week earlier, MWh.
      - name: forecast_tso_mwh
        description: Transelectrica day-ahead forecast, MWh.
      - name: forecast_lgbm_mwh
        description: GridPulse LightGBM day-ahead forecast, MWh.
      - name: forecast_lgbm_kind
        description: live (issued the day before) or backtest (out-of-sample walk-forward).

  - name: mart_forecast_accuracy_daily
    description: "Daily forecast error per model. Grain: one row per local_day. MAPE in percent."
    columns:
      - name: mape_naive_168h_pct
        description: Mean absolute percentage error of the naive forecast that day, percent.
      - name: mape_tso_pct
        description: Same for the Transelectrica forecast, percent.
      - name: mape_lgbm_pct
        description: Same for the LightGBM forecast, percent.

  - name: mart_daily_kpis
    description: "Daily summary of Romania's power system. Grain: one row per complete local day. Prefer this table for daily questions."
    columns:
      - name: local_day
        data_tests: [unique, not_null]
      - name: load_mwh
        description: Total consumption that day, MWh.
      - name: peak_load_mw
        description: Highest hourly consumption that day, MW.
      - name: peak_load_hour
        description: Local start time of the peak hour.
      - name: tso_forecast_mape_pct
        description: Transelectrica forecast error that day, percent.
      - name: generation_mwh
        description: Total generation that day, MWh (battery excluded).
      - name: renewable_share_pct
        description: Share of generation from renewables (hydro, wind, solar, biomass), percent.
      - name: generation_minus_load_mwh
        description: Generation minus consumption, MWh. Positive = Romania exported net, negative = imported.
      - name: price_avg_eur_mwh
        description: Average day-ahead price, EUR/MWh.
      - name: price_max_eur_mwh
        description: Highest hourly day-ahead price, EUR/MWh.
      - name: price_min_eur_mwh
        description: Lowest hourly day-ahead price, EUR/MWh.
      - name: price_peak_hour
        description: Local start time of the most expensive hour.

  - name: fct_load_anomalies
    description: "Hours where actual load deviated unusually from the LightGBM forecast. Grain: one row per hour_utc."
    columns:
      - name: hour_utc
        data_tests: [unique, not_null]
      - name: residual_mwh
        description: Actual minus forecast load, MWh. Positive = more consumption than expected.
      - name: robust_z
        description: Robust z-score of the residual against the previous 28 days (median/MAD).
      - name: is_anomaly
        description: True when abs(robust_z) >= 3.5.
