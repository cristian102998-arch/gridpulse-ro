name: gridpulse
version: "0.1.0"
config-version: 2
profile: gridpulse

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  gridpulse:
    # Descriptions become Postgres comments, so the SQL agent's get_schema can read them.
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  gridpulse:
    +schema: marts
